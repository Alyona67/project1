<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Локации - Фотостудия</title>
</head>
<body>
    <!-- Шапка -->
    <header class="page-header">
        <div class="container">
            <h1 class="page-title">Локации</h1>
            <p class="page-subtitle">Минимализм в деталях</p>
        </div>
    </header>

    <!-- Локации -->
    <section class="locations-section">
        <div class="container">
            <div class="locations-grid">
                <!-- Локация 1 -->
                <div class="location-card">
                    <div class="location-image"></div>
                    <div class="location-content">
                        <h3 class="location-name">Minimal Loft</h3>
                        <p class="location-type">Лофт • 120м²</p>
                        <div class="location-price">2 500 ₽/час</div>
                    </div>
                </div>

                <!-- Локация 2 -->
                <div class="location-card">
                    <div class="location-image"></div>
                    <div class="location-content">
                        <h3 class="location-name">Urban Space</h3>
                        <p class="location-type">Урбан • 90м²</p>
                        <div class="location-price">1 800 ₽/час</div>
                    </div>
                </div>

                <!-- Локация 3 -->
                <div class="location-card">
                    <div class="location-image"></div>
                    <div class="location-content">
                        <h3 class="location-name">Scandi Light</h3>
                        <p class="location-type">Сканди • 75м²</p>
                        <div class="location-price">2 100 ₽/час</div>
                    </div>
                </div>

                <!-- Локация 4 -->
                <div class="location-card">
                    <div class="location-image"></div>
                    <div class="location-content">
                        <h3 class="location-name">Beauty Studio</h3>
                        <p class="location-type">Портрет • 60м²</p>
                        <div class="location-price">3 500 ₽/час</div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Преимущества -->
    <section class="benefits">
        <div class="container">
            <div class="benefits-grid">
                <div class="benefit-item">
                    <div style="font-size: 2rem; color: #c8a97e;">⏱️</div>
                    <h3>Гибкий график</h3>
                </div>
                <div class="benefit-item">
                    <div style="font-size: 2rem; color: #c8a97e;">🎯</div>
                    <h3>Профессиональный свет</h3>
                </div>
                <div class="benefit-item">
                    <div style="font-size: 2rem; color: #c8a97e;">💡</div>
                    <h3>Творческая атмосфера</h3>
                </div>
            </div>
        </div>
    </section>

    <script src="studios.js"></script>
</body>
</html>
